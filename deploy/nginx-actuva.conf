# ACTUVa — actuva.flamen.es
# Certbot добавит SSL-блок автоматически: certbot --nginx -d actuva.flamen.es

server {
    listen 80;
    server_name actuva.flamen.es;

    client_max_body_size 10M;

    location /static/ {
        alias /opt/actuva/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /opt/actuva/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE streaming (chat)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }
}
