<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anamnesis del Dolor Articular · UVa</title>
<style>
:root {
  --yellow:#F5C518; --yellow-mid:#FEF0A0; --yellow-pale:#FFFDE7; --yellow-deep:#D4A000;
  --uva-blue:#003973; --uva-blue-2:#00509e; --uva-red:#c60046;
  --ink:#0F1117; --ink-2:#343A47; --ink-3:#5E6575; --ink-4:#9AA0AD;
  --line:#DDD9CF; --line-light:#E8E4DB;
  --surface:#FEFCF8; --bg:#EAE6DC;
  --green:#059669; --green-pale:#D1FAE5; --green-border:#6EE7B7;
  --red-pale:#FEE2E2; --red-border:#FCA5A5;
  --radius:14px; --radius-sm:8px;
  --shadow-card:0 1px 3px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.08);
  --shadow-lift:0 4px 8px rgba(0,0,0,.07),0 16px 36px rgba(0,0,0,.11);
  --shadow-fc:0 2px 6px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06),inset 0 -1px 0 rgba(0,0,0,.04);
  --font-sans:'Segoe UI',system-ui,-apple-system,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);min-height:100vh;font-size:15px;line-height:1.65;}
body::after{content:'';position:fixed;inset:0;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='1'/%3E%3C/svg%3E");opacity:.022;pointer-events:none;z-index:9999;}
.header{background:linear-gradient(135deg,#002d5c 0%,var(--uva-blue) 60%,#004d8f 100%);padding:1rem 1.6rem;display:flex;align-items:center;gap:1.1rem;border-bottom:3px solid var(--yellow);position:relative;overflow:hidden;}
.header::before{content:'';position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(circle,rgba(245,197,24,.12) 0%,transparent 70%);pointer-events:none;}
.header-brand{display:flex;flex-direction:column;flex-shrink:0;}
.header-badge{background:var(--uva-red);color:#fff;font-weight:800;font-size:.82rem;padding:3px 10px;border-radius:5px;letter-spacing:.6px;display:inline-block;}
.header-sub{font-size:.6rem;color:rgba(160,180,204,.8);margin-top:4px;letter-spacing:1px;text-transform:uppercase;font-weight:600;}
.header-divider{width:1px;height:38px;background:rgba(255,255,255,.15);flex-shrink:0;}
.header-text h1{font-family:var(--font-serif);font-size:1.05rem;font-weight:700;color:#fff;line-height:1.25;}
.header-text p{font-size:.68rem;color:rgba(160,180,204,.85);margin-top:.2rem;}
.progress-wrap{background:var(--line);height:6px;}
.progress-fill{height:6px;background:linear-gradient(90deg,var(--uva-red),#e8005a);transition:width .55s cubic-bezier(.4,0,.2,1);}
.step-nav{display:flex;flex-wrap:wrap;background:var(--surface);border-bottom:1px solid var(--line);padding:.55rem .75rem;gap:.35rem;align-items:center;}
.step-pill{padding:.32rem .8rem;font-size:.7rem;border-radius:20px;font-weight:700;border:1.5px solid var(--line);cursor:pointer;transition:all .2s;white-space:nowrap;background:var(--surface);color:var(--ink-4);display:flex;align-items:center;gap:.3rem;}
.step-pill:hover{background:var(--yellow-pale);border-color:var(--yellow-deep);color:var(--ink);transform:translateY(-1px);}
.step-pill.active{background:var(--yellow);color:var(--ink);border-color:var(--yellow-deep);font-weight:800;box-shadow:0 2px 10px rgba(245,197,24,.35);}
.step-pill.done{background:var(--uva-blue);color:#fff;border-color:var(--uva-blue);}
.step-pill.done:hover{background:var(--uva-blue-2);transform:translateY(-1px);}
.step-pill.summary{background:var(--ink-2);color:#fff;border-color:var(--ink-2);}
.step-pill.quiz{background:var(--uva-red);color:#fff;border-color:var(--uva-red);}
.main{max-width:760px;margin:0 auto;padding:1.6rem 1.2rem 2.5rem;}
.patient-card{background:linear-gradient(135deg,#002d5c 0%,var(--uva-blue) 55%,#004d8f 100%);border-radius:var(--radius);display:flex;overflow:hidden;margin-bottom:1.1rem;box-shadow:0 3px 12px rgba(0,57,115,.25);}
.patient-stripe{background:var(--yellow);width:5px;flex-shrink:0;}
.patient-inner{display:flex;gap:1rem;padding:.8rem 1rem;flex:1;position:relative;overflow:hidden;}
.patient-inner::after{content:'URG';position:absolute;right:.6rem;top:50%;transform:translateY(-50%);font-size:3rem;font-weight:800;color:rgba(255,255,255,.04);pointer-events:none;line-height:1;}
.patient-meta{flex-shrink:0;border-right:1px solid rgba(255,255,255,.12);padding-right:.9rem;display:flex;flex-direction:column;justify-content:center;gap:.25rem;}
.patient-name-tag{font-size:.78rem;font-weight:800;color:var(--yellow);}
.patient-age{font-size:.65rem;color:rgba(160,180,210,.8);font-weight:600;text-transform:uppercase;letter-spacing:.4px;}
.patient-case{font-size:.58rem;color:rgba(160,180,210,.5);font-weight:600;}
.patient-quote-area{flex:1;display:flex;flex-direction:column;justify-content:center;}
.patient-quote-label{font-size:.58rem;font-weight:700;color:rgba(245,197,24,.7);text-transform:uppercase;letter-spacing:.7px;margin-bottom:.2rem;}
.patient-quote{font-size:.88rem;color:rgba(230,238,250,.92);line-height:1.55;font-style:italic;}
.card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line-light);box-shadow:var(--shadow-card);overflow:hidden;margin-bottom:1.5rem;}
.card-head{background:var(--yellow);padding:1.1rem 1.6rem;border-bottom:2px solid var(--yellow-deep);position:relative;overflow:hidden;}
.card-head-deco{position:absolute;right:-.02em;bottom:-.18em;font-family:var(--font-serif);font-size:6.5rem;font-weight:700;line-height:1;color:rgba(0,0,0,.07);pointer-events:none;user-select:none;}
.card-num{font-size:.6rem;color:rgba(61,68,81,.65);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:.2rem;font-weight:700;}
.card-title{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--ink);line-height:1.2;}
.card-body{padding:1.4rem 1.6rem;}
.think-box{background:var(--yellow-pale);border:1px solid rgba(212,160,0,.25);border-left:4px solid var(--yellow);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.9rem 1.1rem;margin-bottom:.9rem;}
.think-box .lbl{font-size:.6rem;color:var(--yellow-deep);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:.25rem;}
.think-box p{font-size:.88rem;color:var(--ink-2);line-height:1.6;}
.pause-p{font-size:.8rem;color:var(--ink-4);font-style:italic;margin-bottom:1rem;}
.btn-reveal{background:var(--yellow);color:var(--ink);border:none;padding:.7rem 1.5rem;border-radius:var(--radius-sm);font-size:.88rem;font-family:inherit;cursor:pointer;font-weight:800;transition:all .2s;box-shadow:0 2px 8px rgba(212,160,0,.25);}
.btn-reveal:hover{background:var(--yellow-deep);color:#fff;transform:translateY(-1px);}
.btn-reveal:disabled{background:var(--line-light);color:var(--ink-4);cursor:default;box-shadow:none;transform:none;}
.btn-next{margin-top:1.1rem;background:var(--yellow);color:var(--ink);border:none;padding:.8rem 1.8rem;border-radius:var(--radius-sm);font-size:.9rem;font-family:inherit;cursor:pointer;font-weight:800;width:100%;transition:all .2s;box-shadow:0 2px 8px rgba(212,160,0,.25);}
.btn-next:hover{background:var(--yellow-deep);color:#fff;transform:translateY(-1px);}
.reveal{display:none;margin-top:1.3rem;border-top:1px solid var(--line-light);padding-top:1.3rem;}
.reveal.on{display:block;animation:fadeUp .3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.sec-label{font-size:.58rem;font-weight:800;color:var(--ink-4);text-transform:uppercase;letter-spacing:1.2px;margin-bottom:.65rem;}
.example-q{background:var(--yellow-pale);border-left:4px solid var(--yellow);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.85rem 1.1rem;margin-bottom:1rem;}
.example-q .lbl{font-size:.58rem;color:var(--yellow-deep);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:.25rem;}
.example-q p{font-size:.9rem;color:var(--ink-2);font-style:italic;line-height:1.6;}
.tip-box{background:rgba(0,57,115,.03);border:1px solid rgba(0,57,115,.1);border-radius:var(--radius-sm);padding:.85rem 1.1rem;margin-bottom:1rem;}
.tip-box .lbl{font-size:.58rem;color:var(--uva-blue);text-transform:uppercase;letter-spacing:1px;font-weight:800;margin-bottom:.25rem;}
.tip-box p{font-size:.84rem;color:var(--ink-2);margin-bottom:.35rem;line-height:1.65;}
.tip-box p strong{color:var(--uva-blue);font-size:.9rem;}
.tip-box p:last-child{margin-bottom:0;}
.fc-hint{font-size:.76rem;color:var(--ink-4);font-style:italic;margin-bottom:.8rem;}
.fc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:1rem;margin-bottom:1.3rem;grid-auto-rows:1fr;}
.fc{perspective:1200px;height:190px;cursor:pointer;}
.fc-inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,0,.2,1),box-shadow .25s;border-radius:12px;box-shadow:var(--shadow-fc);}
.fc:hover .fc-inner{box-shadow:var(--shadow-lift);transform:translateY(-3px);}
.fc.flipped .fc-inner{transform:rotateY(180deg);}
.fc.flipped:hover .fc-inner{transform:rotateY(180deg) translateY(-3px);}
.fc-front,.fc-back{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:1.1rem;text-align:center;}
.fc-front{background:#FEFCF8;border:1px solid var(--line);transition:background .3s,border-color .3s;}
.fc-front.knew-state{background:linear-gradient(148deg,#F0FDF4,#DCFCE7);border-color:var(--green-border);}
.fc-front.unknown-state{background:linear-gradient(148deg,#FFF1F2,#FFE4E6);border-color:var(--red-border);}
.fc-front .fc-label{font-size:1rem;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:.4rem;}
.fc-front .fc-badge{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:4px;background:var(--uva-red);color:#fff;text-transform:uppercase;letter-spacing:.5px;}
.fc-front .fc-tap{font-size:.62rem;color:var(--ink-4);margin-top:.65rem;}
.fc-front .fc-state-badge{font-size:.7rem;font-weight:700;margin-top:.55rem;padding:3px 9px;border-radius:5px;}
.fc-front .fc-state-badge.knew{background:var(--green-pale);color:var(--green);border:1px solid var(--green-border);}
.fc-front .fc-state-badge.unknown{background:var(--red-pale);color:#991b1b;border:1px solid var(--red-border);}
.fc-back{background:var(--surface);border:1.5px solid var(--uva-blue);transform:rotateY(180deg);justify-content:flex-start;align-items:flex-start;text-align:left;overflow-y:auto;}
.fc-back-header{background:var(--uva-blue);width:calc(100% + 2.2rem);margin:-1.1rem -1.1rem .75rem;padding:.5rem 1.1rem;border-radius:11px 11px 0 0;display:flex;align-items:center;justify-content:space-between;}
.fc-back .fc-back-label{font-size:.75rem;font-weight:700;color:#fff;}
.fc-back p{font-size:.83rem;color:var(--ink-2);line-height:1.6;flex:1;}
.knowledge-btns{display:flex;gap:.5rem;margin-top:.85rem;width:100%;}
.btn-knew{background:var(--green-pale);color:#065F46;border:1.5px solid var(--green-border);border-radius:7px;padding:.48rem .7rem;font-size:.76rem;font-weight:800;cursor:pointer;flex:1;font-family:inherit;}
.btn-knew:hover{background:#A7F3D0;}
.btn-unknown{background:var(--red-pale);color:#991B1B;border:1.5px solid var(--red-border);border-radius:7px;padding:.48rem .7rem;font-size:.76rem;font-weight:800;cursor:pointer;flex:1;font-family:inherit;}
.btn-unknown:hover{background:#FECACA;}
.attr-box{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:1.1rem 1.3rem;margin-bottom:1rem;}
.attr-box h3{font-size:.72rem;font-weight:800;color:var(--uva-blue);margin-bottom:.7rem;text-transform:uppercase;letter-spacing:.8px;}
.attr-list{display:grid;gap:.55rem;}
.attr-item{display:flex;gap:.65rem;align-items:flex-start;}
.attr-dot{width:7px;height:7px;border-radius:50%;background:var(--uva-red);flex-shrink:0;margin-top:.52rem;}
.attr-item p{font-size:.86rem;color:var(--ink-2);line-height:1.6;}
.attr-tip{background:var(--yellow-pale);border-left:4px solid var(--yellow);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.75rem 1.1rem;margin-top:.9rem;font-size:.84rem;color:var(--ink-2);font-style:italic;line-height:1.6;}
.final-card{background:var(--yellow-pale);border:1.5px solid rgba(212,160,0,.3);border-radius:var(--radius);padding:1.3rem 1.5rem;margin-bottom:1rem;}
.summary-card{background:var(--surface);border-radius:var(--radius);border:1px solid var(--line);overflow:hidden;margin-bottom:1rem;box-shadow:var(--shadow-card);}
.summary-card .sc-head{background:var(--yellow);color:var(--ink);padding:.8rem 1.4rem;font-weight:800;font-size:.92rem;border-bottom:2px solid var(--yellow-deep);}
.summary-card .sc-body{padding:1rem 1.4rem;}
.q-row{display:flex;gap:.8rem;align-items:flex-start;padding:.5rem 0;border-bottom:1px solid var(--line-light);}
.q-row:last-child{border-bottom:none;}
.q-num{background:var(--yellow);color:var(--ink);font-size:.62rem;font-weight:800;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
.q-title{font-size:.86rem;font-weight:700;color:var(--ink);}
.q-ex{font-size:.76rem;color:var(--ink-4);font-style:italic;margin-top:.05rem;}
.score-panel{background:linear-gradient(135deg,#002d5c 0%,var(--uva-blue) 100%);border-radius:var(--radius);padding:1.1rem 1.3rem;margin-bottom:1rem;display:flex;align-items:center;gap:1rem;flex-wrap:wrap;}
.score-stat{text-align:center;flex:1;min-width:80px;}
.score-stat .num{font-family:var(--font-serif);font-size:2rem;font-weight:700;line-height:1;}
.score-stat .lbl{font-size:.6rem;color:rgba(160,180,210,.7);text-transform:uppercase;letter-spacing:.6px;margin-top:.15rem;}
.score-stat.green .num{color:#6EE7B7;}.score-stat.red .num{color:#FCA5A5;}.score-stat.yellow .num{color:var(--yellow);}
.score-divider{width:1px;height:44px;background:rgba(255,255,255,.12);}
.dx-reveal{border-radius:var(--radius);overflow:hidden;margin-bottom:1.1rem;box-shadow:var(--shadow-card);}
.dx-reveal-top{background:linear-gradient(135deg,var(--uva-red) 0%,#e8005a 100%);padding:1.4rem 1.6rem;text-align:center;}
.dx-reveal-top .dx-eyebrow{font-size:.62rem;color:rgba(254,205,211,.85);text-transform:uppercase;letter-spacing:1.2px;font-weight:800;margin-bottom:.4rem;}
.dx-reveal-top .dx-name{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:#fff;}
.dx-evidence{background:var(--surface);border:1.5px solid rgba(198,0,70,.15);border-top:none;padding:1.1rem 1.3rem;}
.dx-evidence h4{font-size:.62rem;font-weight:800;color:var(--uva-blue);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.7rem;}
.dx-clue{display:flex;gap:.65rem;align-items:flex-start;padding:.35rem 0;border-bottom:1px solid var(--line-light);}
.dx-clue:last-child{border-bottom:none;}
.dx-clue-dot{width:7px;height:7px;border-radius:50%;background:var(--uva-red);flex-shrink:0;margin-top:.52rem;}
.dx-clue p{font-size:.85rem;color:var(--ink-2);line-height:1.6;}
.dx-fb{margin-top:1.3rem;border-radius:var(--radius-sm);overflow:hidden;border:1.5px solid rgba(0,57,115,.25);animation:fadeUp .35s ease both;}
.dx-fb-head{background:linear-gradient(90deg,#002d5c,var(--uva-blue));padding:.6rem 1.1rem;display:flex;align-items:center;justify-content:space-between;gap:.6rem;}
.dx-fb-eyebrow{font-size:.58rem;font-weight:800;color:rgba(160,180,210,.7);text-transform:uppercase;letter-spacing:1px;}
.dx-fb-title{font-size:.78rem;font-weight:700;color:#fff;}
.dx-compat{font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:4px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap;flex-shrink:0;}
.dx-compat.neutral{background:rgba(255,255,255,.12);color:rgba(200,216,232,.8);}
.dx-compat.positive{background:rgba(245,197,24,.18);color:var(--yellow);}
.dx-compat.strong{background:rgba(198,0,70,.25);color:#fca5a5;}
.dx-fb-body{background:#eef4ff;padding:.9rem 1.1rem;display:flex;flex-direction:column;gap:.75rem;border-top:none;}
.dx-quote-box{background:var(--yellow-pale);border-left:3px solid var(--yellow-deep);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:.6rem .9rem;}
.dx-quote-who{font-size:.57rem;font-weight:800;color:var(--yellow-deep);text-transform:uppercase;letter-spacing:.8px;margin-bottom:.2rem;}
.dx-quote-text{font-size:.84rem;color:var(--ink-2);font-style:italic;line-height:1.55;}
.dx-interp{font-size:.84rem;color:var(--ink);line-height:1.65;}
.dx-tags-row{display:flex;flex-direction:column;gap:.4rem;}
.dx-tags-label{font-size:.57rem;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:.1rem;}
.dx-tags-label.fits{color:var(--green);}.dx-tags-label.rules{color:#991b1b;}
.dx-tags{display:flex;flex-wrap:wrap;gap:.35rem;}
.dx-tag{font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:4px;}
.dx-tag.fits{background:var(--green-pale);color:#065F46;border:1px solid var(--green-border);}
.dx-tag.rules{background:var(--red-pale);color:#991b1b;border:1px solid var(--red-border);}
.ev-meter{display:flex;align-items:center;gap:.55rem;margin-top:.5rem;}
.ev-meter-label{font-size:.6rem;font-weight:700;color:rgba(0,0,0,.35);text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;}
.ev-dots{display:flex;gap:3px;}
.ev-dot{width:9px;height:9px;border-radius:50%;background:rgba(0,0,0,.1);}
.ev-dot.neutral{background:#D1D5DB;}.ev-dot.positive{background:var(--uva-blue-2);}.ev-dot.strong{background:var(--uva-red);}
.ev-score{font-size:.62rem;font-weight:800;color:var(--ink-3);}
.quiz-intro{background:linear-gradient(135deg,#002d5c 0%,var(--uva-blue) 100%);color:#fff;border-radius:var(--radius);padding:1.2rem 1.5rem;margin-bottom:1.2rem;}
.quiz-intro h2{font-family:var(--font-serif);font-size:1.1rem;font-weight:700;margin-bottom:.35rem;}
.quiz-intro p{font-size:.84rem;color:rgba(160,180,210,.85);line-height:1.65;}
/* ── TAB ARCHIVADOR ── */
.archiv-wrap{margin-bottom:1rem;}
.archiv-tabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--uva-blue);margin-bottom:0;}
.archiv-tab{padding:.5rem 1.1rem;font-size:.74rem;font-weight:700;border:none;background:var(--bg);color:var(--ink-4);cursor:pointer;font-family:inherit;border-radius:8px 8px 0 0;border:1.5px solid transparent;border-bottom:none;margin-bottom:-2px;transition:all .18s;position:relative;}
.archiv-tab:hover{background:var(--yellow-pale);color:var(--ink);}
.archiv-tab.active{background:var(--surface);color:var(--uva-blue);border-color:var(--uva-blue);border-bottom-color:var(--surface);font-weight:800;z-index:1;}
.archiv-tab.red{}.archiv-tab.red.active{color:var(--uva-red);border-color:var(--uva-red);border-bottom-color:var(--surface);}
.archiv-panel{background:var(--surface);border:1.5px solid var(--uva-blue);border-top:none;border-radius:0 0 var(--radius-sm) var(--radius-sm);padding:1.1rem 1.3rem;animation:fadeUp .22s ease both;}
.archiv-panel.red-border{border-color:var(--uva-red);}
.archiv-badge{display:inline-block;font-size:.6rem;font-weight:800;padding:2px 9px;border-radius:4px;background:var(--uva-red);color:#fff;text-transform:uppercase;letter-spacing:.5px;margin-bottom:.55rem;}
.archiv-panel h4{font-size:.74rem;font-weight:800;color:var(--uva-blue);text-transform:uppercase;letter-spacing:.7px;margin-bottom:.55rem;}
.archiv-panel p{font-size:.86rem;color:var(--ink-2);line-height:1.65;margin-bottom:.45rem;}
.archiv-panel p:last-child{margin-bottom:0;}
.archiv-sub{margin-top:.75rem;padding-top:.65rem;border-top:1px solid var(--line-light);font-size:.8rem;color:var(--uva-blue);font-weight:600;line-height:1.5;}
/* ── IFD TABLE ── */
.ifd-wrap{margin-top:1.4rem;border:1.5px solid var(--line);border-radius:var(--radius-sm);overflow:hidden;}
.ifd-head{background:var(--uva-blue);color:#fff;display:grid;grid-template-columns:1fr 2fr;font-size:.62rem;font-weight:800;text-transform:uppercase;letter-spacing:.7px;}
.ifd-head div{padding:.5rem .9rem;}

const STEP_DX = [
  {quoteIdx:0,compat:'positive',compatLabel:'Dato orientativo',evidence:2,
   interpretation:'La descripción del dolor ya orienta al mecanismo. El dolor inflamatorio empeora en reposo y mejora con el movimiento (el movimiento calienta y lubrica la articulación inflamada). El dolor mecánico ocurre al contrario: mejora con el reposo y empeora con la actividad (carga y desgaste del cartílago). Esta distinción es el primer y más importante filtro diagnóstico en reumatología.',

  {quoteIdx:1,compat:'strong',compatLabel:'Evidencia fuerte',evidence:3,

   fitsFor:['Artritis reumatoide idiopática'],rulesOut:['Artritis psoriásica (sin psoriasis)','Artritis reactiva (sin infección previa)','Artropatía enteropática (sin diarrea)']},
];

    tipT:'Inflamatorio vs mecánico: la distinción más importante de la reumatología',

    pause:'¿Cuántas articulaciones separan monoartritis de oligoartritis? ¿Qué diagnóstico sospechas ante una oligoartritis asimétrica de rodillas con dolor lumbar de ritmo inflamatorio?',

    tabs:[

       body:['La monoartritis aguda es una urgencia diagnóstica hasta descartar artritis séptica y gota. La artrocentesis (punción articular) es la prueba diagnóstica clave en cualquier monoartritis no explicada.','Causas frecuentes: gota (primera MTF — podagra — clásica en varón), pseudogota (cristales de pirofosfato, rodilla frecuente en anciano), artritis séptica (fiebre + articulación muy inflamada = emergencia), hemartrosis (trauma, anticoagulantes, hemofilia).','La artritis séptica destruye el cartílago en días. Ante monoartritis con fiebre: artrocentesis urgente antes del antibiótico.'],

      {label:'Afectación axial',badge:'COLUMNA / SACROILÍACAS',title:'Afectación axial — espondiloartropatías',

// ── TAB PANEL COMPONENT ───────────────────────────────────────────────────────
function TabPanel({tabs, title}){
  const[active,setActive]=useState(0);
  const tab=tabs[active];
  const isRed = tab.alert;
  return html`<div class="archiv-wrap">
    <div class="sec-label">${title}</div>
    <div class="archiv-tabs">
      ${tabs.map((tb,i)=>html`<button key=${i} class=${`archiv-tab ${i===active?'active':''} ${tb.alert?'red':''}`} onClick=${()=>setActive(i)}>${tb.label}</button>`)}
    </div>
    <div class=${`archiv-panel ${isRed?'red-border':''}`}>
      <div class="archiv-badge">${tab.badge}</div>
      <h4>${tab.title}</h4>
      ${tab.body.map((p,i)=>html`<p key=${i} dangerouslySetInnerHTML=${{__html:p}}></p>`)}
      ${tab.sub&&html`<div class="archiv-sub" dangerouslySetInnerHTML=${{__html:tab.sub}}></div>`}
    </div>
  </div>`;
}

function starsFor(si,kn){const s=STEPS[si];if(!s?.items)return null;const tot=s.items.length;const ans=s.items.filter((_,i)=>kn[`s${si}_c${i}`]).length;if(!ans)return null;const k=s.items.filter((_,i)=>kn[`s${si}_c${i}`]==='knew').length;return Math.round(k/tot*3);}
function StarDisplay({count,small}){if(count===null)return null;return html`<span style=${{fontSize:small?'.65rem':'.85rem',letterSpacing:'-1px'}}>${[0,1,2].map(i=>html`<span key=${i} style=${{color:i<count?'#F5C518':'#D1D5DB'}}>★</span>`)}</span>`;}

// ── FLASHCARD ─────────────────────────────────────────────────────────────────
function FlashCard({id,label,badge,body,knowledge,onKnowledge}){
  const[flipped,setFlipped]=useState(false);
  const k=knowledge[id];
  const knew=useCallback(e=>{e.stopPropagation();onKnowledge(id,'knew');},[id,onKnowledge]);
  const unknown=useCallback(e=>{e.stopPropagation();onKnowledge(id,'unknown');},[id,onKnowledge]);
  return html`
    <div class=${`fc ${flipped?'flipped':''}`} onClick=${()=>setFlipped(f=>!f)}>
      <div class="fc-inner">
        <div class=${`fc-front ${k==='knew'?'knew-state':k==='unknown'?'unknown-state':''}`}>
          <div class="fc-label">${label}</div>
          <div class="fc-badge">${badge}</div>
          ${!k&&!flipped&&html`<div class="fc-tap">tocar para ver</div>`}
          ${k==='knew'&&html`<div class="fc-state-badge knew">✓ Dominada</div>`}
          ${k==='unknown'&&html`<div class="fc-state-badge unknown">↩ Para repasar</div>`}
        </div>
        <div class="fc-back">
          <div class="fc-back-header">
            <div class="fc-back-label">${label}</div>
            <button onClick=${e=>{e.stopPropagation();setFlipped(false);}} style=${{background:'rgba(255,255,255,.18)',border:'none',color:'#fff',borderRadius:'5px',padding:'2px 9px',fontSize:'.62rem',fontWeight:700,cursor:'pointer'}}>← Volver</button>
          </div>
          <div style=${{fontSize:'.6rem',fontWeight:800,padding:'3px 9px',borderRadius:'4px',background:'var(--uva-red)',color:'#fff',textTransform:'uppercase',letterSpacing:'.5px',display:'inline-block',marginBottom:'.65rem'}}>${badge}</div>
          <p dangerouslySetInnerHTML=${{__html:body}}></p>
          ${!k&&html`<div class="knowledge-btns">
            <button class="btn-knew" onClick=${knew}>✓ Ya lo sabía</button>
            <button class="btn-unknown" onClick=${unknown}>↩ Repasar</button>
          </div>`}
        </div>
      </div>
    </div>`;
}

            <div style=${{fontSize:'.58rem',fontWeight:800,padding:'2px 8px',borderRadius:'4px',background:col.badge.bg,color:col.badge.color,textTransform:'uppercase',letterSpacing:'.4px',flexShrink:0}}>${c.compat==='strong'?'Alta especificidad':'Orientativo'}</div>
          </div>
          <div style=${{padding:'.75rem 1rem'}}>
            <div style=${{display:'flex',flexWrap:'wrap',gap:'.3rem',marginBottom:'.7rem'}}>
              ${c.symptoms.map((s,j)=>html`<span key=${j} style=${{fontSize:'.72rem',fontWeight:600,padding:'2px 8px',borderRadius:'4px',background:col.tag.bg,color:col.tag.color,border:`1px solid ${col.tag.border}`}}>${s}</span>`)}
            </div>
            <div style=${{fontSize:'.78rem',color:col.key,lineHeight:1.55,fontStyle:'italic',borderTop:'1px solid rgba(255,255,255,.07)',paddingTop:'.55rem'}}>${c.key}</div>
          </div>
        </div>`;
      })}
    </div>
  </div>`;
}

// ── DX FEEDBACK ───────────────────────────────────────────────────────────────
function DiagnosticFeedback({stepIdx}){
  const dx=STEP_DX[stepIdx];if(!dx)return null;
  const quote=PATIENT.quotes[dx.quoteIdx];
  return html`<div class="dx-fb">
    <div class="dx-fb-head">
      <div><div class="dx-fb-eyebrow">Diagnóstico en construcción</div><div class="dx-fb-title">¿Qué nos dice este dato de Elena?</div></div>
      <div class=${`dx-compat ${dx.compat}`}>${dx.compatLabel}</div>
    </div>
    <div class="dx-fb-body">
      ${quote&&html`<div class="dx-quote-box"><div class="dx-quote-who">Elena dice</div><div class="dx-quote-text">${quote}</div></div>`}
      <p class="dx-interp">${dx.interpretation}</p>
      <div class="dx-tags-row">
        ${dx.fitsFor?.length>0&&html`<div><div class="dx-tags-label fits">Apunta hacia</div><div class="dx-tags">${dx.fitsFor.map((t,i)=>html`<span key=${i} class="dx-tag fits">${t}</span>`)}</div></div>`}
        ${dx.rulesOut?.length>0&&html`<div><div class="dx-tags-label rules">Hace menos probable</div><div class="dx-tags">${dx.rulesOut.map((t,i)=>html`<span key=${i} class="dx-tag rules">${t}</span>`)}</div></div>`}
      </div>
    </div>
  </div>`;}

// ── EVIDENCE METER ────────────────────────────────────────────────────────────
function EvidenceMeter({revealedSteps}){
  const nSteps=STEPS.filter(s=>!s.isSummaryStep&&!s.isQuizStep).length;
  const dots=Array.from({length:nSteps},(_,i)=>revealedSteps[i]?(STEP_DX[i]?STEP_DX[i].compat:'neutral'):'empty');
  const completados=dots.filter(d=>d!=='empty').length;
  if(!completados)return null;
  const sospecha=dots.filter(d=>d==='strong').length;
  return html`<div>
    <div class="ev-meter">
      <div class="ev-meter-label">Bloques completados</div>
      <div class="ev-dots">${dots.map((d,i)=>html`<div key=${i} class=${`ev-dot ${d!=='empty'?d:''}`}></div>`)}</div>
      <div class="ev-score" style=${{marginRight:'.2rem'}}>${completados}/${nSteps}</div>
      ${sospecha>0&&html`<div style=${{fontSize:'.56rem',fontWeight:800,color:'var(--uva-red)',background:'rgba(198,0,70,.08)',border:'1px solid rgba(198,0,70,.2)',borderRadius:'4px',padding:'1px 7px',whiteSpace:'nowrap'}}>⚠ ${sospecha} señal${sospecha>1?'es':''} clave</div>`}
    </div>
    <div style=${{display:'flex',gap:'.75rem',marginTop:'.3rem',flexWrap:'wrap'}}>
      <div style=${{display:'flex',alignItems:'center',gap:'.25rem'}}><div style=${{width:'8px',height:'8px',borderRadius:'50%',background:'rgba(0,0,0,.12)'}}></div><span style=${{fontSize:'.52rem',color:'rgba(0,0,0,.35)',fontWeight:600}}>Pendiente</span></div>
      <div style=${{display:'flex',alignItems:'center',gap:'.25rem'}}><div style=${{width:'8px',height:'8px',borderRadius:'50%',background:'var(--uva-blue-2)'}}></div><span style=${{fontSize:'.52rem',color:'rgba(0,0,0,.35)',fontWeight:600}}>Dato orientativo</span></div>
      <div style=${{display:'flex',alignItems:'center',gap:'.25rem'}}><div style=${{width:'8px',height:'8px',borderRadius:'50%',background:'var(--uva-red)'}}></div><span style=${{fontSize:'.52rem',color:'rgba(0,0,0,.35)',fontWeight:600}}>Evidencia fuerte</span></div>
    </div>
  </div>`;}

// ── ATRIB BOX ─────────────────────────────────────────────────────────────────
function AtribBox(){
  const items=[
    ['Psoriasis cutánea (personal o familiar)','La psoriasis es el antecedente más importante para diagnosticar artritis psoriásica. Puede preceder a la artritis años o incluso décadas. Preguntar siempre por placas en cuero cabelludo, codos, rodillas y zona lumbosacra — el paciente puede no haberlo relacionado. Un familiar con psoriasis también aumenta la probabilidad.'],
    ['Infección previa (digestiva o genitourinaria)','La artritis reactiva aparece 1-4 semanas después de una infección por Salmonella, Shigella, Campylobacter, Yersinia (digestiva) o Chlamydia trachomatis (genitourinaria). Preguntar siempre: «¿Tuvo diarrea, fiebre o molestias al orinar en las últimas semanas antes de que le empezaran las articulaciones?»'],
    ['Diarrea crónica o enfermedad inflamatoria intestinal','La artropatía enteropática asociada a enfermedad de Crohn o colitis ulcerosa es una espondiloartropatía. La artritis puede correlacionar con la actividad de la EII (artritis periférica) o seguir un curso independiente (artritis axial). Preguntar por diarrea crónica, sangre en heces, dolor abdominal recurrente.'],
    ['Antecedentes familiares de artritis o espondilitis','La AR tiene un componente genético significativo (HLA-DR4, PTPN22). La espondilitis anquilosante y las espondiloartropatías están fuertemente asociadas al HLA-B27. Un familiar de primer grado con AR duplica el riesgo. La espondilitis familiar es frecuente.'],
    ['Medicamentos que producen artritis o artralgia','Fármacos que producen lupus inducido (artritis + ANA +): hidralazina, procainamida, isoniazida, minociclina. Fármacos que producen artralgia/miopatía: estatinas, quinolonas, inhibidores de aromatasa. Fármacos que producen hiperuricemia y gota: diuréticos tiazídicos, ciclosporina, aspirina a bajas dosis.'],
    ['Uveítis, uretritis o lesiones mucosas','La uveítis anterior (ojo rojo doloroso con fotofobia) se asocia fuertemente a espondiloartropatías (especialmente HLA-B27 positivo). La uretritis estéril + conjuntivitis + artritis = síndrome de Reiter (artritis reactiva). Las úlceras orales recurrentes orientan a lupus o enfermedad de Behçet.'],
  ];
  return html`<div class="attr-box">
    <h3>Antecedentes clave en el dolor articular</h3>
    <div class="attr-list">
      ${items.map(([title,txt],i)=>html`<div key=${i} class="attr-item"><div class="attr-dot"></div><p><strong>${title}:</strong> ${txt}</p></div>`)}
    </div>
    <div class="attr-tip">Las cinco preguntas que nunca pueden faltar: ¿psoriasis? ¿infección reciente? ¿diarrea crónica / EII? ¿antecedentes familiares? ¿medicamentos? — orientan el diagnóstico diferencial de la artritis inflamatoria.</div>
  </div>`;}

// ── QUIZ CARD ─────────────────────────────────────────────────────────────────
function QuizCard({card,id,knowledge,onKnowledge}){
  const[flipped,setFlipped]=useState(false);const k=knowledge[id];
  const rows=[['Claves diagnósticas',card.claves],['Exploración / Prueba clave',card.prueba],['Mecanismo fisiopatológico',card.pat],['Orientación diagnóstica',card.orienta]];
  return html`
    <div class=${`fc ${flipped?'flipped':''}`} style=${{minHeight:'290px'}} onClick=${()=>setFlipped(f=>!f)}>
      <div class="fc-inner">
        <div class=${`fc-front ${k==='knew'?'knew-state':k==='unknown'?'unknown-state':''}`} style=${{background:'#F8F9FA',border:'1.5px solid var(--line)',justifyContent:'flex-start',alignItems:'stretch',padding:0,textAlign:'left',minHeight:'290px'}}>
          <div style=${{background:'var(--uva-blue)',padding:'.6rem 1rem',borderRadius:'8px 8px 0 0'}}>
            <div style=${{fontSize:'1rem',fontWeight:700,color:'#fff'}}>${card.dx}</div>
          </div>
          <div style=${{flex:1,padding:'.7rem 1rem',display:'flex',flexDirection:'column',justifyContent:'space-between'}}>
            <div style=${{fontSize:'.81rem',color:'var(--ink-2)',lineHeight:1.55,fontStyle:'italic'}}>${card.caso}</div>
            <div style=${{fontSize:'.68rem',color:'var(--uva-blue)',fontWeight:700,textAlign:'center',marginTop:'.5rem'}}>¿Cuál es el diagnóstico más probable?</div>
          </div>
        </div>
        <div class="fc-back" style=${{padding:'.6rem .85rem',background:'#F8F9FA',minHeight:'290px'}}>
          <div style=${{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:'.5rem'}}>
            <div style=${{fontSize:'.76rem',fontWeight:800,color:'var(--uva-blue)'}}>${card.dx}</div>
            <button onClick=${e=>{e.stopPropagation();setFlipped(false);}} style=${{background:'var(--uva-blue)',border:'none',color:'#fff',borderRadius:'5px',padding:'2px 9px',fontSize:'.62rem',fontWeight:700,cursor:'pointer'}}>← Volver</button>
          </div>
          <div style=${{display:'grid',gap:'.3rem'}}>
            ${rows.map(([l,v])=>html`<div key=${l} style=${{background:'#fff',borderRadius:'6px',border:'1px solid var(--line-light)',padding:'.32rem .6rem'}}>
              <div style=${{fontSize:'.58rem',fontWeight:700,color:'var(--uva-red)',textTransform:'uppercase',letterSpacing:'.4px',marginBottom:'.08rem'}}>${l}</div>
              <div style=${{fontSize:'.72rem',color:'var(--ink-2)',lineHeight:1.38}}>${v}</div>
            </div>`)}
          </div>
          ${!k&&html`<div class="knowledge-btns" style=${{marginTop:'.4rem'}}>
            <button class="btn-knew" onClick=${e=>{e.stopPropagation();onKnowledge(id,'knew');}}>✓ Ya lo sabía</button>
            <button class="btn-unknown" onClick=${e=>{e.stopPropagation();onKnowledge(id,'unknown');}}>↩ Repasar</button>
          </div>`}
        </div>
      </div>
    </div>`;
}

// ── STEP CONTENT ──────────────────────────────────────────────────────────────
function boldTip(p){return p.replace(/^([^\n:]{2,}?):/gm,'<strong style="color:var(--uva-blue);font-size:.88rem">$1:</strong>');}
function StepContent({step,stepIdx,revealed,knowledge,onReveal,onKnowledge,onNext}){
  if(step.isSummaryStep){
    const kw=Object.values(knowledge).filter(v=>v==='knew').length;
    const an=Object.values(knowledge).length;
    const uk=Object.values(knowledge).filter(v=>v==='unknown').length;
    return html`<div>
      <div class="dx-reveal">
        <div class="dx-reveal-top"><div class="dx-eyebrow">Diagnóstico del caso de Elena</div><div class="dx-name">${PATIENT.diagnosis}</div></div>
        <div class="dx-evidence">
          <h4>Claves de la anamnesis que lo orientaban</h4>
          ${PATIENT.diagnosisKey.map((c,i)=>html`<div key=${i} class="dx-clue"><div class="dx-clue-dot"></div><p>${c}</p></div>`)}
        </div>
      </div>
      ${an>0&&html`<div class="score-panel">
        <div class="score-stat yellow"><div class="num">${an}</div><div class="lbl">Evaluadas</div></div>
        <div class="score-divider"></div>
        <div class="score-stat green"><div class="num">${kw}</div><div class="lbl">Dominadas</div></div>
        <div class="score-divider"></div>
        <div class="score-stat red"><div class="num">${uk}</div><div class="lbl">Para repasar</div></div>
      </div>`}
      <div class="final-card">
        <div style=${{fontSize:'1.4rem',marginBottom:'.4rem'}}>✓</div>
        <h2 style=${{fontSize:'1rem',marginBottom:'.3rem'}}>Anamnesis completada</h2>
        <p style=${{fontSize:'.84rem',color:'var(--ink-2)',lineHeight:'1.6'}}>La anamnesis del dolor articular permite orientar el diagnóstico en la mayoría de casos. El primer filtro (inflamatorio vs mecánico) y la distribución articular son los dos datos más poderosos.</p>
      </div>
      <div class="summary-card">
        <div class="sc-head">Las 6 preguntas clave de la anamnesis del dolor articular</div>
        <div class="sc-body">${ALL_QS.map(q=>html`<div key=${q.n} class="q-row"><div class="q-num">${q.n}</div><div><div class="q-title">${q.title}</div><div class="q-ex">${q.eq}</div></div></div>`)}</div>
      </div>
      <button class="btn-next" onClick=${onNext}>¿Cuánto has aprendido? →</button>
    </div>`;}

  if(step.isQuizStep){return html`<div>
    <div class="quiz-intro"><h2>Comprueba cuánto has aprendido</h2><p>Cada tarjeta muestra un caso clínico. Antes de girarla, identifica el diagnóstico más probable a partir de la anamnesis.</p></div>
    <div class="fc-grid">${QUIZ_CARDS.map((q,i)=>html`<${QuizCard} key=${i} card=${q} id=${`qc${i}`} knowledge=${knowledge} onKnowledge=${onKnowledge}/>`)}
    </div>
  </div>`;}

  const tipParts=Array.isArray(step.tip)?step.tip:(step.tip||'').split('\n\n');
  let contentBlock=null;
  if(step.isTabStep){contentBlock=html`<div><${TabPanel} tabs=${step.tabs} title=${step.tabTitle}/>${step.showIFD&&html`<${IFDPanel}/>`}</div>`;}
  else if(step.isAtrib){contentBlock=html`<${AtribBox}/>`;}  else if(step.items){
    contentBlock=html`<div>
      <div class="sec-label">¿Qué nos dice cada hallazgo? — Evalúa lo que sabes</div>
      <p class="fc-hint">Toca cada tarjeta para ver la orientación diagnóstica, luego indica si ya lo sabías</p>
      <div class="fc-grid">${step.items.map((it,i)=>html`<${FlashCard} key=${i} id=${`s${stepIdx}_c${i}`} label=${it.label} badge=${it.badge} body=${it.body} knowledge=${knowledge} onKnowledge=${onKnowledge}/>`)}</div>
      ${step.hasCombos&&html`<${ComboGrid}/>`}
    </div>`;}

  return html`<div>
    <div class="think-box"><div class="lbl">Piensa antes de continuar</div><p>${step.think}</p></div>
    <p class="pause-p">${step.pause}</p>
    <button class="btn-reveal" disabled=${revealed} onClick=${onReveal}>Ver ejemplo y claves diagnósticas</button>
    ${revealed&&html`<div class="reveal on">
      <div class="sec-label">Ejemplo de pregunta al paciente</div>
      <div class="example-q"><div class="lbl">Cómo preguntarlo</div><p>${step.eq}</p></div>
      ${step.tipT&&html`<div class="tip-box"><div class="lbl">${step.tipT}</div>${tipParts.map((p,i)=>html`<p key=${i} dangerouslySetInnerHTML=${{__html:boldTip(p)}}/>`)} </div>`}
      <${DiagnosticFeedback} stepIdx=${stepIdx}/>
      ${contentBlock}
      <button class="btn-next" onClick=${onNext}>${step.isFinal?'Ver ficha resumen →':'Siguiente bloque →'}</button>
    </div>`}
  </div>`;}

// ── APP ───────────────────────────────────────────────────────────────────────
function App(){
  const[cur,setCur]=useState(0);
  const[revealed,setRevealed]=useState({});
  const[knowledge,setKnowledge]=useState({});
  const onKnowledge=useCallback((id,val)=>setKnowledge(p=>({...p,[id]:val})),[]);
  const goTo=i=>{setCur(i);window.scrollTo({top:0});};
  const doReveal=()=>setRevealed(p=>({...p,[cur]:true}));
  const doNext=()=>{if(cur<STEPS.length-1){setCur(c=>c+1);window.scrollTo({top:0});}};
  const step=STEPS[cur];
  const isL=!step.isSummaryStep&&!step.isQuizStep;
  const qIdx=isL?Math.min(cur,PATIENT.quotes.length-1):-1;
  const pct=(cur/(STEPS.length-1))*100;

  return html`<div>
    <div class="topbar"><a href="index.html" class="back-btn"><svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M8 2L4 6l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>← Volver al índice</a></div>
<div class="header">
      <div class="header-brand"><span class="header-badge">EduMed · UVa</span><span class="header-sub">Educación Médica</span></div>
      <div class="header-divider"></div>
      <div class="header-text"><h1>Anamnesis del Dolor Articular</h1><p>Facultad de Medicina · Universidad de Valladolid</p></div>
    </div>
    <div class="progress-wrap"><div class="progress-fill" style=${{width:`${pct}%`}}></div></div>
    <div class="step-nav">
      ${STEPS.map((s,i)=>{
        const st=starsFor(i,knowledge);
        let cls='step-pill';
        if(s.isSummaryStep)cls+=' summary';
        else if(s.isQuizStep)cls+=' quiz';
        else if(i<cur&&revealed[i])cls+=' done';
        if(i===cur)cls+=' active';
        return html`<div key=${i} class=${cls} onClick=${()=>goTo(i)}>
          ${s.nav}${st!==null&&html`<${StarDisplay} count=${st} small/>`}
        </div>`;
      })}
    </div>
    <div class="main">
      <div class="card">
        <div class="card-head">
          <div class="card-num">Paso ${cur+1} de ${STEPS.length}</div>
          <div class="card-title">${step.title}</div>
          ${isL&&html`<${EvidenceMeter} revealedSteps=${revealed}/>`}
          ${isL&&html`<span class="card-head-deco" aria-hidden="true">${String(cur+1).padStart(2,'0')}</span>`}
        </div>
        <div class="card-body">
          ${isL&&qIdx>=0&&html`<div class="patient-card">
            <div class="patient-stripe"></div>
            <div class="patient-inner">
              <div class="patient-meta">
                <div class="patient-name-tag">${PATIENT.name}</div>
                <div class="patient-age">${PATIENT.age} años · Mujer</div>
                <div class="patient-case">CONS-2026 · 10:00 h</div>
              </div>
              <div class="patient-quote-area">
                <div class="patient-quote-label">Dice la paciente</div>
                <div class="patient-quote">${PATIENT.quotes[qIdx]}</div>
              </div>
            </div>
          </div>`}
          <${StepContent} step=${step} stepIdx=${cur} revealed=${!!revealed[cur]} knowledge=${knowledge} onReveal=${doReveal} onKnowledge=${onKnowledge} onNext=${doNext}/>
        </div>
      </div>
    </div>
    <footer>
      <div><strong>Material docente</strong> para mejorar la anamnesis clínica</div>
      <div>Propedéutica Clínica · Grado en Medicina · Universidad de Valladolid · Elaborado en mayo de 2026</div>
    </footer>
  </div>`;}

render(h(App,null),document.getElementById('root'));
</script>
</body></html>
